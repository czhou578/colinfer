[project]
name = "colin-inference-engine"
version = "0.0.1"
description = "Single-user inference engine for Qwen3.8-27B on one DGX Spark (GB10, sm_121)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Host-side toolchain: pinned exactly, these are sm_121-sensitive (see PLAN.md 1.x).
    # torch cu130 matches the nvcc 13.0 on the box so torch.utils.cpp_extension builds cleanly.
    "torch==2.14.1",
    # FlashInfer: python package + the GB10-specific (sm121a) JIT cache, which holds the kernels the engine calls (FA2
    # prefill attention, top-k / top-p renormalization). flashinfer-cubin (6.3 GB of TRT-LLM / DeepGEMM cubins for other
    # Blackwell parts) is not needed.
    "flashinfer-python==0.7.0.post1",
    "flashinfer-jit-cache==0.7.0.post1",
    "flashinfer-jit-cache-sm121a==0.7.0.post1",
    # Model loading / tokenization.
    "transformers==5.18.0",
    "safetensors>=0.8.0",
    "tokenizers>=0.23.0",
    "numpy>=2.3",
    # Build helper for torch.utils.cpp_extension / CMake.
    "ninja>=1.11",
    "fastapi>=0.142.2",
    # HTTP server: uvicorn picks up uvloop and httptools when they are installed (its [standard] extra also brings
    # file watching, websockets and .env support, which the server does not use).
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
    "httptools>=0.8.0",
]

[project.urls]
Repository = "https://github.com/czhou578/colinfer"

[dependency-groups]
dev = [
    "accelerate>=1.15.0",
    "pyarrow>=25.0.1",
    "pytest>=9.0",
]

[tool.uv]
# The flashinfer-jit-cache shim hard-depends on precompiled providers for every
# CUDA arch (~hundreds of MB each). Only sm121a (GB10) is useful here; drop the rest.
override-dependencies = [
    "flashinfer-jit-cache-sm100a; python_version < '0'",
    "flashinfer-jit-cache-sm103a; python_version < '0'",
    "flashinfer-jit-cache-sm110a; python_version < '0'",
    "flashinfer-jit-cache-sm120f; python_version < '0'",
    "flashinfer-jit-cache-sm80; python_version < '0'",
    "flashinfer-jit-cache-sm89; python_version < '0'",
    "flashinfer-jit-cache-sm90a; python_version < '0'",
]

# Reproducible: torch and flashinfer wheels come only from their own indexes.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
flashinfer-jit-cache = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm121a = { index = "flashinfer-cu130" }
